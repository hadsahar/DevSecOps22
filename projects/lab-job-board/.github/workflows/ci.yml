name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/jobboard

jobs:
  # ────────────────────────────────────────────────────────────
  lint-test-python:
    name: Lint & Test – Jobs Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ --max-line-length=100 --ignore=E501,W503

      - name: Run tests
        run: |
          pip install pytest httpx
          pytest tests/ -v --tb=short 2>/dev/null || echo "⚠️  No tests found – add tests in jobs-service/tests/"

  # ────────────────────────────────────────────────────────────
  lint-test-node:
    name: Lint & Test – Applications Service (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: applications-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=critical

  # ────────────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-test-python, lint-test-node]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./jobs-service
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-jobs:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build applications-service
        uses: docker/build-push-action@v5
        with:
          context: ./applications-service
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-applications:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  scan-images:
    name: Scan Images for CVEs (Trivy)
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jobs-service for scanning
        run: docker build -t scan-jobs ./jobs-service

      - name: Run Trivy on jobs-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:     scan-jobs
          format:        table
          exit-code:     "0"
          severity:      CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build applications-service for scanning
        run: docker build -t scan-apps ./applications-service

      - name: Run Trivy on applications-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:     scan-apps
          format:        table
          exit-code:     "0"
          severity:      CRITICAL,HIGH
          ignore-unfixed: true

  # ────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Start all services
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          timeout 90 bash -c '
            until docker compose ps | grep -q "healthy"; do sleep 5; done
          '
          sleep 10

      - name: Test – Jobs Service health
        run: curl -sf http://localhost/api/jobs/health | grep healthy

      - name: Test – Applications Service health
        run: curl -sf http://localhost/api/applications/health | grep healthy

      - name: Test – List jobs returns data
        run: |
          COUNT=$(curl -sf http://localhost/api/jobs/ | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Jobs found: $COUNT"
          [ "$COUNT" -ge 1 ] || (echo "Expected at least 1 seeded job" && exit 1)

      - name: Test – Create and retrieve a job
        run: |
          JOB=$(curl -sf -X POST http://localhost/api/jobs/ \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Test Job","description":"Created by integration test pipeline","company":"CI Runner","location":"GitHub Actions"}')
          JOB_ID=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Created job: $JOB_ID"
          curl -sf http://localhost/api/jobs/$JOB_ID | grep "CI Test Job"

      - name: Test – Submit an application
        run: |
          JOB_ID=$(curl -sf http://localhost/api/jobs/ | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          curl -sf -X POST http://localhost/api/applications/ \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"$JOB_ID\",\"applicant_name\":\"CI Tester\",\"applicant_email\":\"ci@test.com\",\"cover_letter\":\"Automated test application\"}" | grep "CI Tester"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ────────────────────────────────────────────────────────────
  push-to-registry:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./jobs-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-jobs:latest
            ${{ env.IMAGE_PREFIX }}-jobs:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push applications-service
        uses: docker/build-push-action@v5
        with:
          context: ./applications-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-applications:latest
            ${{ env.IMAGE_PREFIX }}-applications:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nginx:latest
            ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| jobs-service         | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| applications-service | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend             | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nginx                | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
