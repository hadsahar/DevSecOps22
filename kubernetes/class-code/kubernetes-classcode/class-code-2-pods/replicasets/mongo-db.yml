apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: mongo-rs
  labels:
    app: mongo-db
spec:
  replicas: 1
  selector:
   matchLabels:
     app: mongo-db
  template:
   metadata:
     name: mongo-pod
     labels:
       app: mongo-db
   spec:
    containers:
      - name: mongo-db
        image: mongo
        ports:
         - containerPort: 27017
        env: 
          - name: MONGO_INITDB_ROOT_USERNAME
            value: admin
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: admin
          
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
spec:
  type: NodePort
  selector:
    app: mongo-db
  ports:
  - port: 27017
    targetPort: 27017
    nodePort: 30303
