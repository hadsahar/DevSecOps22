<!DOCTYPE html>
<html>
<head>
    <title>Styled Page</title>
    <style>
        /* This is where the styling goes */
        body {
            background-color: #f0f2f5; /* Light gray background */
            font-family: Arial, sans-serif;
            color: yellow;
            line-height: 1.6;
            margin: 40px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .btn:hover {
            background-color: #2980b9; /* Darker blue on hover */
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>My Styled Page</h1>
        <p>This paragraph looks much better with some padding and a nice font!</p>
        <a href="#" class="btn">Clickable Button</a>
    </div>

</body>
</html>
